# Venturelyx :: application tier (API + Command Center + Caddy).
#   docker compose -f infra/docker-compose.data.yml \
#                  -f infra/docker-compose.workers.yml \
#                  -f infra/docker-compose.app.yml \
#                  --env-file infra/.env up -d

name: venturelyx

networks:
  venturelyx:
    external: true
    name: venturelyx

services:
  api:
    build:
      context: ../api
    image: venturelyx/api:latest
    container_name: vx-api
    restart: unless-stopped
    networks: [venturelyx]
    environment:
      NODE_ENV: production
      PORT: 3000
      # Connects as the APP role so RLS applies. Never the superuser.
      DATABASE_URL: postgresql://${APP_DB_USER}:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SESSION_SECRET: ${SESSION_SECRET}
      VAULT_KEY: ${VAULT_KEY}
      CORS_ORIGINS: https://app.venturelyx.com
      DB_POOL_MAX: 12
      LOG_LEVEL: info
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 768m
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  web:
    build:
      context: ../web
      args:
        NEXT_PUBLIC_API_BASE: https://api.venturelyx.com/v1
    image: venturelyx/web:latest
    container_name: vx-web
    restart: unless-stopped
    networks: [venturelyx]
    environment:
      NODE_ENV: production
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 512m
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  caddy:
    image: caddy:2-alpine
    container_name: vx-caddy
    restart: unless-stopped
    networks: [venturelyx]
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    # cloudflared runs on the host, so this must be reachable at localhost:8080.
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - api
      - web
    mem_limit: 128m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
