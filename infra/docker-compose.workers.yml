# Venturelyx :: worker tier. Joins the existing venturelyx network.
#   docker compose -f infra/docker-compose.data.yml -f infra/docker-compose.workers.yml \
#                  --env-file infra/.env up -d

name: venturelyx

networks:
  venturelyx:
    external: true
    name: venturelyx

services:
  leadsource-worker:
    build:
      context: ../workers/leadsource
    image: venturelyx/leadsource-worker:latest
    container_name: vx-leadsource-worker
    restart: unless-stopped
    networks: [venturelyx]
    environment:
      # Normal app role — job-queue claim + per-org fan-out into
      # leadsource_leads (RLS-scoped, same as every other worker).
      DB_DSN: postgresql://${APP_DB_USER}:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # 040_leadsource.sql's restricted role — the ONLY thing with
      # INSERT/UPDATE on leadsource_raw_records. Never used for anything else.
      RAW_DB_DSN: postgresql://venturelyx_leadsource_worker:${LEADSOURCE_WORKER_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SUNBIZ_SFTP_HOST: ${SUNBIZ_SFTP_HOST}
      SUNBIZ_SFTP_USER: ${SUNBIZ_SFTP_USER}
      SUNBIZ_SFTP_PASS: ${SUNBIZ_SFTP_PASS}
      # Enrichment (Phase 3). Same ZeroBounce key the API container already
      # uses for Grow's verify-on-import — one account, two processes.
      ZEROBOUNCE_API_KEY: ${GROW_EMAIL_VERIFY_API_KEY:-}
      # No platform-level Brave key: Brave is bring-your-own-key, per org,
      # stored encrypted in leadsource_provider_keys (043_leadsource_provider_keys.sql)
      # and decrypted here with VAULT_KEY — same vault every other
      # third-party credential in this app already uses. See vault.py.
      VAULT_KEY: ${VAULT_KEY}
      LOG_LEVEL: INFO
      POLL_SECONDS: 30
      WORKER_ID: leadsource-worker-1
    depends_on:
      postgres:
        condition: service_healthy
    # Bumped from 256m for the quarterly backfill (Phase 4): streaming
    # keeps Python's own footprint flat regardless of file size, but the
    # unzip subprocess and general overhead need some real headroom when
    # a ~1.87GB member is being extracted.
    mem_limit: 512m
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  seo-worker:
    build:
      context: ../workers/seo
    image: venturelyx/seo-worker:latest
    container_name: vx-seo-worker
    restart: unless-stopped
    networks: [venturelyx]
    environment:
      # Connects as the APP role, so RLS applies to the worker exactly as it
      # does to the API. Never the superuser.
      DB_DSN: postgresql://${APP_DB_USER}:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      LOG_LEVEL: INFO
      POLL_SECONDS: 10
      WORKER_ID: seo-worker-1
      # Same vault key the API encrypts integrations.credential_enc with —
      # the worker decrypts GSC refresh tokens with it, never plaintext at rest.
      VAULT_KEY: ${VAULT_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    # Was 1g. A headless Chromium base process plus up to 2 concurrent
    # rendering tabs (crawler.py's render_sem) can peak near 1g on their own
    # for render=True sites (geodynparking, atleticosoflo) — this leaves
    # headroom so a heavy page OOM-kills the whole worker instead of just
    # failing one job. shm_size covers the other half of the classic
    # Docker+Chromium gotcha (crawler.py also passes --disable-dev-shm-usage
    # as belt-and-suspenders, not redundant — either alone is a single point
    # of failure if the other gets dropped in a future edit).
    mem_limit: 2g
    shm_size: 512m
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  grow-worker:
    # Same image as the api service (../api), different command — the
    # worker is api/src/worker/growWorker.ts, built into the same dist/ and
    # sharing every lib/ it needs (db.ts, auth.ts, growTemplate.ts,
    # growScheduler.ts) rather than a separate package to keep in sync.
    build:
      context: ../api
    image: venturelyx/api:latest
    container_name: vx-grow-worker
    command: ["node", "dist/worker/growWorker.js"]
    restart: unless-stopped
    networks: [venturelyx]
    environment:
      NODE_ENV: production
      # Connects as the APP role, so RLS applies exactly as it does to the
      # API. Never the superuser.
      DATABASE_URL: postgresql://${APP_DB_USER}:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      VAULT_KEY: ${VAULT_KEY}
      GROW_BASE_URL: ${GROW_BASE_URL:-https://app.venturelyx.com}
      LOG_LEVEL: info
      # Only consumed by the weekly `docker compose run --rm grow-worker node
      # dist/worker/aiVisibilityCheck.js --all-due` one-off (see that file and
      # docs/DEPLOY-GSC.md's cron section) — the grow-worker loop itself never
      # calls AI. Same shared-fallback env vars as the api service
      # (docker-compose.app.yml), so an org without a BYO key still works.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 384m
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
