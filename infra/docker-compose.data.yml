# =============================================================================
# Venturelyx :: data tier
# acxnet07 (192.168.1.158)
#
# Nothing here publishes a port to the LAN except via explicit 127.0.0.1 binds
# used for maintenance. Application services join this network in a later block.
# =============================================================================

name: venturelyx

networks:
  venturelyx:
    name: venturelyx
    driver: bridge

volumes:
  pgdata:
    name: venturelyx_pgdata
  redisdata:
    name: venturelyx_redisdata
  miniodata:
    name: venturelyx_miniodata

services:

  postgres:
    image: postgres:17-bookworm
    container_name: vx-postgres
    restart: unless-stopped
    networks: [venturelyx]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Deterministic collation. Prevents index corruption on glibc upgrades.
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=en-US --encoding=UTF8"
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
      - /opt/venturelyx/backups:/backups
    # Bound to loopback only — psql from the host, never from the LAN.
    ports:
      - "127.0.0.1:5432:5432"
    command:
      - postgres
      # --- sized for 7 GB RAM. At 16 GB see docs/ARCHITECTURE.md §11 ---
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=3GB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - work_mem=16MB
      - -c
      - max_connections=120
      - -c
      - random_page_cost=1.1          # SSD-backed
      - -c
      - effective_io_concurrency=200
      - -c
      - wal_compression=on
      - -c
      - max_wal_size=2GB
      - -c
      - min_wal_size=256MB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - log_min_duration_statement=1000
      - -c
      - log_lock_waits=on
      - -c
      - log_connections=on
      - -c
      - track_io_timing=on
      - -c
      - timezone=UTC
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    stop_grace_period: 1m
    shm_size: 256mb
    # Protect Postgres from the OOM killer at the container level instead of
    # setting vm.overcommit_memory=2 globally (which breaks Chromium/V8).
    oom_score_adj: -500
    mem_limit: 2g
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  redis:
    image: redis:7-alpine
    container_name: vx-redis
    restart: unless-stopped
    networks: [venturelyx]
    volumes:
      - redisdata:/data
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    mem_limit: 768m
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }

  minio:
    image: minio/minio:latest
    container_name: vx-minio
    restart: unless-stopped
    networks: [venturelyx]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_CONSOLE_URL:-http://192.168.1.158:9001}
    volumes:
      - miniodata:/data
    # Console bound to the LAN for setup convenience; the S3 API stays internal.
    ports:
      - "127.0.0.1:9000:9000"
      - "192.168.1.158:9001:9001"
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 768m
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }
